name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --check dist/index.js
      - name: Smoke test del plugin caricato
        run: node test/smoke.plugin.mjs
      - name: Nessun segreto nel sorgente
        run: |
          # Chiavi Resend e valori reali assegnati a variabili di password.
          # Pattern volutamente stretti: regex larghe generano falsi positivi.
          if git grep -nE '(re_[A-Za-z0-9]{20,}|(PASSWORD|SMTP_PASS|APP_PASS)=[A-Za-z0-9]{12,})' -- src test .github; then
            echo "::error::possibile credenziale nel sorgente"
            exit 1
          fi
          echo "nessuna credenziale rilevata"